  <rect x="224" y="86" width="156" height="318" rx="8" fill="#0B111D" stroke="#0284C7" stroke-width="1.2"/>
  <rect x="232" y="96" width="8" height="8" rx="2" fill="#38BDF8"/>
  <text x="248" y="104" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">IN PROGRESS</text>
  <rect x="352" y="94" width="20" height="14" rx="4" fill="#0C4A6E"/>
  <text x="359" y="105" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="9" font-weight="700">3</text>

