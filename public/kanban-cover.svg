  <rect x="570" y="122" width="160" height="80" rx="6" fill="#131C2D" stroke="#0284C7" stroke-width="1"/>
  <text x="580" y="142" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Go Hub Manager</text>
  <text x="580" y="158" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8.5">Active Clients: 24</text>
  <text x="580" y="172" fill="#10B981" font-family="ui-monospace, monospace" font-size="8.5">Fanout: 480 msg/sec</text>
  <text x="580" y="188" fill="#F59E0B" font-family="ui-monospace, monospace" font-size="8.5">Latency: &lt; 2 ms</text>

  <!-- Storage Engine Box -->
  <rect x="570" y="212" width="160" height="80" rx="6" fill="#131C2D" stroke="#334155" stroke-width="1"/>
  <text x="580" y="232" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Storage Layers</text>
  <text x="580" y="248" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="8.5">PostgreSQL 16 (State)</text>
  <text x="580" y="262" fill="#F59E0B" font-family="ui-monospace, monospace" font-size="8.5">MinIO S3 (Attachments)</text>
  <text x="580" y="278" fill="#10B981" font-family="ui-monospace, monospace" font-size="8.5">Redis (Pub/Sub Sync)</text>

  <!-- Performance Metric Strip -->
  <rect x="570" y="302" width="160" height="88" rx="6" fill="#162234" stroke="#1E293B" stroke-width="1"/>
  <text x="580" y="322" fill="#64748B" font-family="ui-monospace, monospace" font-size="9">EVENT CONFLICTS</text>
  <text x="580" y="342" fill="#10B981" font-family="ui-monospace, monospace" font-size="16" font-weight="700">0 Lost Updates</text>
  <text x="580" y="362" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8.5">Versioned state checks</text>
  <text x="580" y="376" fill="#64748B" font-family="ui-monospace, monospace" font-size="8">OPTIMISTIC RECONCILIATION</text>
</svg>