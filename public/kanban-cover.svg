  <circle cx="248" cy="196" r="8" fill="#0284C7"/>
  <text x="244" y="199" fill="#FFF" font-size="8" font-weight="700">TT</text>
  <circle cx="262" cy="196" r="8" fill="#10B981"/>
  <text x="259" y="199" fill="#FFF" font-size="8" font-weight="700">G1</text>
  <text x="278" y="199" fill="#64748B" font-family="ui-monospace, monospace" font-size="8.5">synced live</text>

  <!-- Card 2.2 -->
  <rect x="232" y="222" width="140" height="74" rx="6" fill="#172236" stroke="#283A4E" stroke-width="1"/>
  <rect x="240" y="230" width="56" height="15" rx="3" fill="#3B2E15"/>
  <text x="246" y="241" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MINIO S3</text>
  <text x="240" y="260" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Presigned upload</text>
  <text x="240" y="276" fill="#64748B" font-family="ui-monospace, monospace" font-size="8.5">4.8 MB attachment</text>

