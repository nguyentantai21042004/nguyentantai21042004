  <rect x="518" y="94" width="20" height="14" rx="4" fill="#064E3B"/>
  <text x="522" y="105" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="9" font-weight="700">12</text>

  <!-- Card 3.1 -->
  <rect x="398" y="118" width="140" height="74" rx="6" fill="#172236" stroke="#283A4E" stroke-width="1"/>
  <text x="406" y="142" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Next.js 14 optimistic</text>
  <text x="406" y="158" fill="#10B981" font-family="ui-monospace, monospace" font-size="8.5">Instant UI reorder</text>
  <text x="406" y="174" fill="#64748B" font-family="ui-monospace, monospace" font-size="8.5">conflict rollback ready</text>

  <!-- Card 3.2 -->
  <rect x="398" y="200" width="140" height="74" rx="6" fill="#172236" stroke="#283A4E" stroke-width="1"/>
  <text x="406" y="224" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">JWT Authentication</text>
  <text x="406" y="240" fill="#10B981" font-family="ui-monospace, monospace" font-size="8.5">Secure cookie store</text>
  <text x="406" y="256" fill="#64748B" font-family="ui-monospace, monospace" font-size="8.5">OAuth2 provider link</text>

