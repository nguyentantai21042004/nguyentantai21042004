  <rect x="232" y="118" width="140" height="96" rx="6" fill="#0C253E" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="240" y="126" width="70" height="15" rx="3" fill="#0369A1"/>
  <text x="246" y="137" fill="#E0F2FE" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">WEBSOCKET</text>
  <text x="240" y="156" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700">Broadcast channel</text>
  <text x="240" y="172" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="8.5">goroutine pool · RWMutex</text>
