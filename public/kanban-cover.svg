  <rect x="556" y="86" width="188" height="318" rx="8" fill="#080D16" stroke="#1E293B" stroke-width="1"/>
  <text x="570" y="110" fill="#64748B" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.5">HUB &amp; BROADCAST BUS</text>

