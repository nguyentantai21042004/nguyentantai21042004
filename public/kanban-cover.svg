<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0A0F16"/>

  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid-kanban" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#grid-kanban)"/>

  <!-- Main Window Frame -->
  <rect x="40" y="28" width="720" height="394" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="40" y="28" width="720" height="42" rx="12" fill="#131C31" stroke="#334155" stroke-width="1"/>
  <circle cx="66" cy="49" r="5" fill="#EF4444"/>
  <circle cx="82" cy="49" r="5" fill="#F59E0B"/>
  <circle cx="98" cy="49" r="5" fill="#10B981"/>

  <text x="122" y="53" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">KANBAN // REAL-TIME WEBSOCKET COLLABORATION ENGINE</text>
  
  <!-- Live Sync Badge -->
  <rect x="560" y="38" width="184" height="22" rx="11" fill="#063E32" stroke="#059669" stroke-width="1"/>
  <circle cx="574" cy="49" r="3.5" fill="#10B981"/>
  <text x="586" y="53" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10" font-weight="700">WS BROADCAST · 0ms LAG</text>

  <!-- Left 2/3: Kanban Board Columns -->
  <!-- Column 1: BACKLOG -->
  <rect x="58" y="86" width="156" height="318" rx="8" fill="#0B111D" stroke="#1E293B" stroke-width="1"/>
  <rect x="66" y="96" width="8" height="8" rx="2" fill="#64748B"/>
  <text x="82" y="104" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">BACKLOG</text>
  <rect x="186" y="94" width="20" height="14" rx="4" fill="#1E293B"/>
  <text x="193" y="105" fill="#64748B" font-family="ui-monospace, monospace" font-size="9" font-weight="700">2</text>

  <!-- Card 1.1 -->
  <rect x="66" y="118" width="140" height="74" rx="6" fill="#172236" stroke="#283A4E" stroke-width="1"/>
  <rect x="74" y="126" width="56" height="15" rx="3" fill="#3B1D22"/>
  <text x="80" y="137" fill="#F87171" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">P0 · CORE</text>
  <text x="74" y="156" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">PostgreSQL locks</text>
  <text x="74" y="172" fill="#64748B" font-family="ui-monospace, monospace" font-size="8.5">SELECT FOR UPDATE</text>

  <!-- Card 1.2 -->
  <rect x="66" y="200" width="140" height="74" rx="6" fill="#172236" stroke="#283A4E" stroke-width="1"/>
  <rect x="74" y="208" width="56" height="15" rx="3" fill="#1E293B"/>
  <text x="80" y="219" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">P2 · ASYNC</text>
  <text x="74" y="238" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Audit trail log</text>
  <text x="74" y="254" fill="#64748B" font-family="ui-monospace, monospace" font-size="8.5">Worker goroutine</text>

